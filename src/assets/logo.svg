<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEC643"/>
      <stop offset="100%" stop-color="#D4B03D"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#141414" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Thân vé với 2 vết khuyết tròn 2 bên -->
  <path d="
    M 14 30
    H 106
    Q 106 30 106 40
    A 8 8 0 0 0 106 56
    Q 106 66 106 90
    H 14
    Q 14 90 14 80
    A 8 8 0 0 0 14 64
    Q 14 54 14 30
    Z"
    fill="url(#goldGrad)" stroke="#141414" stroke-width="2" filter="url(#softShadow)"/>

  <!-- Đường đứt nét ngăn cuống vé -->
  <line x1="86" y1="30" x2="86" y2="90" stroke="#141414" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Biểu tượng máy bay nhỏ trên cuống vé -->
  <g transform="translate(96,60) rotate(45)" fill="#141414">
    <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" opacity="0.9"/>
  </g>

  <!-- Chữ trên vé -->
  <text x="52" y="56" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#141414" text-anchor="middle" letter-spacing="0.5">PATH</text>
  <text x="52" y="72" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#141414" text-anchor="middle" letter-spacing="0.5">TRIP</text>
</svg>